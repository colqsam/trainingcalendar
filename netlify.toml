[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173

# SPA fallback so client routing / refreshes resolve to index.html.
# Function routes (/.netlify/functions/*) are handled automatically by Netlify
# and are not affected by this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
